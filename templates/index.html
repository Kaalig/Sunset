<!DOCTYPE HTML>
<html lang="fr-FR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/styles.css">
        <title>Sunset</title>
    </head>

<body>
    <section>
         <div id="sunset">  
            <h1>Sunset</h1>
         </div>
         <div class="citation center"> 
            <p id="citation"></p>
        </div>
        <div class="date-display center">
            <p id="date-display"></p>
        </div>
    </section>
    <section>
        <div class="first_onglet center">
            <button id="btn-dashboard">Tableau de Bord</button>
        </div>
        <div class="onglets center">
            <button id="btn-notes">Notes</button>
            <button id="btn-habits">Habitudes</button>
            <button id="btn-rdv">Rendez-vous</button>
        </div>
         <div class="first_onglet center">
            <h3 id="page-title">Tableau de Bord / Page d'accueil</h3>
        </div>

    </section>

    <main>
        <section id="dashboard">   
            <div class="card center">
                <h4>Habitudes en cours</h4>
                <div class="little_header">
                    <p>Habits actives</p>
                    <p>Completion semaine</p>
                    <p>Evolution vs semaine passée</p>
                </div>
            </div>
            <div class="card center">
                <h4>RDV cette semaine</h4>
            </div>
            <div class="card center">
                <h4>Dernières notes</h4>
            </div>
        </section>
        
        <section id="habits" style="display: none;">
            <div class="center">
                <button id="btn-new-habits">+ New habit</button>
                <div id="modal-habit" style="display: none;">
                <div class="modal-content">
                    <h3>Nouvelle Habitude</h3>
                    <label>Nom</label>
                    <input type="text" id="habit-name" placeholder="Ex: Pompes, Lire 30min...">
                    <label>Objectif (nombre)</label>
                    <input type="number" id="habit-goal" value="7">
                    <label>Description (optionnel)</label>
                    <input type="text" id="habit-description" placeholder="Description...">
                    <div class="modal-buttons">
                        <button id="btn-cancel-habit">Annuler</button>
                        <button id="btn-create-habit">Créer</button>
                    </div>
                </div>
                </div>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Habitude</th>
                            <th>Objectif</th>
                            <th>Lun</th>
                            <th>Mar</th>
                            <th>Mer</th>
                            <th>Jeu</th>
                            <th>Ven</th>
                            <th>Sam</th>
                            <th>Dim</th>
                            <th class="total">Total</th>
                        </tr>
                    </thead>
                    <tbody id="habits-body">
                    </tbody>
                </table>
            </div>
        </section>

        <section id="notes" style="display: none;">
            <div class="center">
                <button id="btn-new-note">+ New Note</button>
                <button id="corbeille">Corbeille</button>
            </div>
            <div class="card" id="notes-list">
            </div>
        </section>
        <section id="rendez-vous" style="display: none;"></section>





    </main>

<script type="module" src="static/js/main.js"></script>
</body>

</html>
